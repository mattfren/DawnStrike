[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dawnstrike-intraday-scanner"
version = "0.1.0"
description = "Provider-agnostic aggressive intraday scanner and paper-audit platform."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "defusedxml>=0.7",
  "openai>=2.0",
  "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pytest>=8.0",
  "ruff>=0.4",
]
browser = [
  "playwright>=1.45",
]
research = [
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.scripts]
intraday-scan = "intraday_scanner.cli:main"
build-snapshot = "intraday_scanner.snapshot_builder:main"
paper-audit = "intraday_scanner.paper_audit:main"
performance-reconcile = "intraday_scanner.performance.cli:main"

[tool.setuptools.packages.find]
include = ["intraday_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Historical gate scripts are byte-sealed evidence. Keep their exact audited
# bytes while confining legacy style exceptions to the ten named artifacts.
[tool.ruff.lint.per-file-ignores]
"docs/quant-refactor/evidence/final-immutable-gate-20260817/run_gate_shard.py" = ["E402", "I001"]
"docs/quant-refactor/evidence/final-immutable-gate-20260817/seal_final_gate.py" = ["E501", "I001"]
"docs/quant-refactor/evidence/final-immutable-gate-20260817/validate_final_gate.py" = ["I001"]
"docs/quant-refactor/evidence/final-immutable-gate-20260817/validate_source_inventory.py" = ["I001"]
"docs/quant-refactor/evidence/final-repair-completion-20260816/capture_freeze.py" = ["E501", "I001"]
"docs/quant-refactor/evidence/final-repair-completion-20260816/capture_inventory.py" = ["E402", "E501"]
"docs/quant-refactor/evidence/final-repair-completion-20260816/seal_recovery_terminal.py" = ["E501", "I001"]
"docs/quant-refactor/evidence/final-repair-completion-20260816/validate_current_inventory.py" = ["E402", "I001"]
"docs/quant-refactor/evidence/final-repair-completion-20260816/validate_shard_evidence.py" = ["I001"]
"docs/quant-refactor/evidence/final-repair-completion-20260816/validate_source_test_freeze.py" = ["I001"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
