# Forward-only paper-research configuration. Copy to config\web_sources.yaml locally.
# It deliberately remains outside the point-in-time V6 production contract: no historical
# universe claims, no historical backtests, and no live-order execution are permitted.
enabled: true
respect_robots: true
user_agent: "DawnstrikeResearchBot/1.0 contact: REQUIRED_ACCOUNTABLE_EMAIL"
timeout_seconds: 15
rate_limit_seconds: 5
save_raw: true
production_contract: false
allowed_domains:
  - nasdaqtrader.com
  - sec.gov
  - stockanalysis.com
  - www.stockanalysis.com
  - tradingview.com
  - www.tradingview.com
sources:
  - name: local_inbox
    type: local_inbox
    enabled: true
    path: data\inbox\screener
  - name: stockanalysis_premarket
    type: public_table_url
    enabled: true
    url: "https://stockanalysis.com/markets/premarket/"
  - name: tradingview_premarket
    type: public_table_url
    enabled: true
    url: "https://www.tradingview.com/markets/stocks-usa/market-movers-pre-market-gainers/"
  - name: nasdaq_symbols
    type: nasdaq_symbol_directory
    enabled: true
    role: universe_only
  - name: nasdaq_halts
    type: nasdaq_trade_halts_rss
    enabled: true
  - name: sec_edgar
    type: sec_edgar
    enabled: true
